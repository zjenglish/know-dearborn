<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Watching Dearborn</title>

<style>
/* Layout: a coach's chalk talk. Each slide = an animated pitch (left / top) plus a plain-words card (right / below). Gold = Fenway, red = Dearborn. */
:root{
  --bg:#eef2ee; --card:#ffffff; --ink:#14201a; --muted:#56635b; --line:#d3dcd5;
  --accent:#1d5a3a; --gold:#e8b931; --gold-ink:#7a5600; --red:#c8362c; --good:#1f7a45; --bad:#b3261e;
  --grass1:#2f7d4a; --grass2:#2a7343; --chalk:rgba(255,255,255,.82);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1410; --card:#152019; --ink:#e7eee9; --muted:#9aaa9f; --line:#283830;
  --accent:#6cc995; --gold-ink:#e8c25a; --good:#5fc08a; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1410; --card:#152019; --ink:#e7eee9; --muted:#9aaa9f; --line:#283830;
  --accent:#6cc995; --gold-ink:#e8c25a; --good:#5fc08a; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.deck{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top .brand{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.legend{display:flex;gap:14px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.slide{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.slide{grid-template-columns:minmax(0,1fr)}}
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:center}
.stage{position:relative;width:100%;max-width:100%;border-radius:6px;overflow:hidden;background:var(--grass2);box-shadow:0 1px 0 var(--line)}
.stage svg{display:block;width:100%;height:100%}
.tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:clamp(.72rem,1.7vw,.98rem);
  line-height:1.1;padding:3px 8px;border-radius:3px;white-space:nowrap;pointer-events:none;transition:opacity .25s;opacity:0;
  background:rgba(12,24,17,.86);color:#fff;letter-spacing:.02em}
.tag.d{background:#c8362c;color:#fff}
.tag.f{background:#e8b931;color:#1c1400}
.tag.on{opacity:1}
.pill{position:absolute;right:10px;top:10px;font-family:var(--display);font-weight:800;font-size:clamp(.85rem,2vw,1.15rem);letter-spacing:.08em;
  text-transform:uppercase;padding:3px 10px;border-radius:3px;color:#fff;opacity:0;transition:opacity .25s}
.pill.on{opacity:1}
.pill.bad{background:#b3261e}.pill.good{background:#1f7a45}
.cap{min-height:3.1em;width:100%;font-size:1.05rem;font-weight:500;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:4px}
.ctrl{display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
button{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:7px 14px;border-radius:4px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.text{display:flex;flex-direction:column;gap:14px;min-width:0}
.kick{font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;text-transform:uppercase}
h1{font-size:clamp(2.4rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800}
p{margin:0}
.lead{font-size:1.1rem}
.blk{display:flex;flex-direction:column;gap:6px}
.blk h3{margin:0;font-family:var(--display);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.blk ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
.yell{align-self:flex-start;font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em;
  border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--card));color:var(--ink);padding:4px 14px;border-radius:3px}
.yell small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--muted)}
.word{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);padding:8px 12px;border-radius:3px}
.word b{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.cards .c{background:var(--card);border:1px solid var(--line);padding:14px 16px;border-radius:4px;display:flex;flex-direction:column;gap:6px}
.cards .c b{font-family:var(--display);font-size:1.4rem;text-transform:uppercase;color:var(--accent)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots button{width:12px;height:12px;min-height:0;padding:0;border-radius:50%;background:var(--line);border:0}
.dots button[aria-current=true]{background:var(--accent);width:26px;border-radius:6px}
.count{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
@media (prefers-reduced-motion:reduce){.tag,.pill{transition:none}}
</style>
</head>

const SL=[
 {s:'title',h:`<span class="kick">Thu 11/12 · 4:00 · Rotch Field</span><h1>What to watch vs Dearborn</h1>
   <p class="lead">Ten short clips. Each one shows something Dearborn does, or something we need to do, and what it looks like when it goes right and wrong.</p>
   <div class="blk"><h3>How to use it</h3><ul><li>Each clip loops. Use <b>Slow</b> or drag the bar to look closely.</li><li>The caption under the field tells you what's happening.</li><li>The gold box on each slide is what to yell from the sideline.</li><li>Arrow keys or the buttons at the bottom move between slides.</li></ul></div>`},
 {s:'basics',h:`<span class="kick">Start here</span><h2>Who's where on our team</h2>
   <p class="lead">Soccer teams line up in rows, back to front. People call each row a "line."</p>
   <div class="blk"><h3>Look for</h3><ul><li>Defenders in the back, midfield in the middle, attackers in front.</li><li>Johann and Juvens are the two right in front of the defense. Their main job is protecting it.</li></ul></div>
   <div class="word"><b>Formation</b> · the shape a team lines up in, counted back to front. "4-3-3" means 4 defenders, 3 midfielders, 3 attackers.</div>`},
 {s:'shape',h:`<span class="kick">First 10 minutes</span><h2>What shape is Dearborn in?</h2>
   <p class="lead">Our scouting says they play a 4-3-3, but they might switch to a 3-5-2. You can tell in the first few minutes.</p>
   <div class="blk"><h3>Look for</h3><ul><li>When we have the ball, count their players across the back. 4 or 3?</li><li>If it's 3, their wide players run the whole sideline. Tell our wingers to attack the space behind them.</li></ul></div>
   <div class="yell">"Run in behind!"<small>if it's the 3-5-2</small></div>`},
 {s:'lines',h:`<span class="kick">All game</span><h2>Lines together</h2>
   <p class="lead">The single biggest thing. When we defend, our three rows stay close, like one block that slides side to side.</p>
   <div class="blk"><h3>Look for</h3><ul><li>A big empty space between our defenders and our midfield. That's the danger.</li><li>Attackers chasing the ball alone while everyone else stays back.</li></ul></div>
   <div class="word"><b>Compact</b> · players close together, no big gaps.</div>
   <div class="yell">"Lines!"<small>everyone squeeze together</small></div>`},
 {s:'eight',h:`<span class="kick">Their key player</span><h2>Their #8</h2>
   <p class="lead">Their center midfielder. He gets the ball in front of our defense and passes it forward straight away, first time.</p>
   <div class="blk"><h3>Look for</h3><ul><li>Is #8 getting the ball with nobody near him? That's the problem.</li><li>Johann or Juvens should stay in front of our defense, not run off chasing.</li></ul></div>
   <div class="word"><b>First time</b> · passing the ball the moment it arrives, without stopping it first.</div>
   <div class="yell">"Find #8!"<small>or "stay home, 8"</small></div>`},
 {s:'delay',h:`<span class="kick">Their fast player</span><h2>#18 and the word "delay"</h2>
   <p class="lead">#18 plays on the side and he is fast. If our defender dives in, #18 just runs past him.</p>
   <div class="blk"><h3>Look for</h3><ul><li>Our fullback (Diego or Leisson) should back up and stay between #18 and our goal.</li><li>Then a teammate comes to help, and they trap him on the sideline, two against one.</li></ul></div>
   <div class="word"><b>Fullback</b> · the defender on the side of the back line.</div>
   <div class="yell">"Delay! Don't dive!"</div>`},
 {s:'trans',h:`<span class="kick">After we lose the ball</span><h2>Sprint back</h2>
   <p class="lead">When Dearborn wins the ball, they send 3 or 4 players forward fast and kick it into the space behind our defense.</p>
   <div class="blk"><h3>Look for</h3><ul><li>The moment we lose the ball: are our players turning and running back, or walking?</li><li>Do our defenders drop back together, or does one get left behind?</li></ul></div>
   <div class="word"><b>Goal side</b> · standing between the player you're guarding and your own goal.</div>
   <div class="word"><b>Transition</b> · the few seconds right after the ball changes teams.</div>
   <div class="yell">"Sprint! Goal side!"</div>`},
 {s:'pinch',h:`<span class="kick">Our defense</span><h2>Pinch in</h2>
   <p class="lead">Sometimes a center back steps up to challenge an attacker. That leaves a hole behind him. Everyone else has to slide over to fill it.</p>
   <div class="blk"><h3>Look for</h3><ul><li>A defender steps up. Do the other three slide toward the middle?</li><li>The winger on the far side should drop back to help.</li></ul></div>
   <div class="word"><b>Weak side</b> · the side of the field away from the ball.</div>
   <div class="yell">"Pinch in!"</div>`},
 {s:'corner',h:`<span class="kick">Their #1 danger</span><h2>Their short corner</h2>
   <p class="lead">Their best play. Instead of kicking the corner into the box, they pass it short to #8, everyone runs in, and #8 passes it back out for a shot.</p>
   <div class="blk"><h3>Look for</h3><ul><li>Before every Dearborn corner: is one of ours standing at the top of the box?</li><li>Our defenders should stay touching distance from their runners.</li></ul></div>
   <div class="word"><b>The 18</b> · the big box in front of the goal (it's 18 yards deep). "Top of the 18" is its front edge.</div>
   <div class="yell">"Top of the box!"<small>yell it before every corner</small></div>`},
 {s:'throw',h:`<span class="kick">Their other set piece</span><h2>Their long throw</h2>
   <p class="lead">They throw it long toward the goal. Three players stand in a line, and the first one heads it on toward the far side.</p>
   <div class="blk"><h3>Look for</h3><ul><li>Is one of ours at the back post before the throw?</li><li>When the ball gets there, kick it far away. No fancy stuff.</li></ul></div>
   <div class="word"><b>Back post</b> · the side of the goal farther from the ball. <b>Flick-on</b> · a light header that keeps the ball going.</div>
   <div class="yell">"Back post! Clear it!"</div>`},
 {s:'attack',h:`<span class="kick">How we score</span><h2>Wide, then low</h2>
   <p class="lead">Our plan: get the ball to a winger on the side, run at them, pass it across, and shoot low.</p>
   <div class="blk"><h3>Look for</h3><ul><li>Are we getting the ball out wide, or forcing it through the crowded middle?</li><li>The winger on the far side should be running in toward the goal.</li><li>Shots should be low, not blasted over the bar.</li></ul></div>
   <div class="yell">"Wide!" then "Low!"</div>`},
 {s:null,h:`<span class="kick">At halftime</span><h2>Pick one fix</h2>
   <p class="lead">Don't give them five things. Pick the one that matches the score.</p>
   <div class="cards">
     <div class="c"><b>Tied</b><p>Press harder at chosen moments. Fresh legs on the wings.</p></div>
     <div class="c"><b>Winning</b><p>Stay compact in the middle. Make them go around us. Counter when there's space.</p></div>
     <div class="c"><b>Losing</b><p>Wingers push higher and go at them. Press higher up the field. Get it wide fast.</p></div>
   </div>
   <div class="blk"><h3>Subs to have ready</h3><ul><li>A fresh winger for the second half.</li><li>A fast fullback if #18 is beating our defender on his side.</li></ul></div>`},
 {s:null,h:`<span class="kick">Cheat sheet</span><h2>Sideline words</h2>
   <div class="gloss">
     <div class="word"><b>Lines!</b> · get back into three tight rows.</div>
     <div class="word"><b>Delay!</b> · back off, stay between him and our goal, wait for help.</div>
     <div class="word"><b>Goal side</b> · between your man and our goal.</div>
     <div class="word"><b>Pinch in</b> · defenders slide toward the middle.</div>
     <div class="word"><b>Top of the box!</b> · someone stand at the front edge of the big box.</div>
     <div class="word"><b>Back post</b> · the far side of the goal.</div>
     <div class="word"><b>Clear it</b> · kick it far away, high and wide.</div>
     <div class="word"><b>Wide!</b> · pass it out to the side.</div>
     <div class="word"><b>Low!</b> · keep shots on the ground.</div>
     <div class="word"><b>Weak side</b> · the side away from the ball.</div>
     <div class="word"><b>Transition</b> · the seconds after the ball changes teams.</div>
     <div class="word"><b>Set piece</b> · corners, free kicks, throw-ins.</div>
   </div>`}
];

  (scene.tags||[]).forEach(tg=>{const [a,b,txt,x,y,c]=tg;const d=document.createElement('div');d.className='tag'+(c?' '+c:'');d.textContent=txt;
    d.style.left=((x-v[0])/v[2]*100)+'%';d.style.top=((y-v[1])/v[3]*100)+'%';stage.appendChild(d);tagEls.push({a,b,d});});
  scrub.max=scene.dur;t=reduce?(scene.still||scene.dur*.6):0;render();
}
function render(){
  if(!scene)return;
  nodes.forEach(({en,g})=>{const [x,y]=pos(en.k,t);g.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+')');g.style.opacity=(en.in!=null&&t<en.in)?0:1;});
  zoneEls.forEach(z=>z.e.style.opacity=(t>=z.a&&t<=z.b)?1:0);
  arrowEls.forEach(r=>{const on=t>=r.a&&t<=r.b;r.e.setAttribute('opacity',on?.95:0);r.e.setAttribute('stroke-dashoffset',on?Math.max(0,1-(t-r.a)/.7):1);});
  tagEls.forEach(x=>x.d.classList.toggle('on',t>=x.a&&t<=x.b));
  let c='';(scene.cap||[]).forEach(([ct,tx])=>{if(t>=ct)c=tx;});if(capEl.textContent!==c)capEl.textContent=c;
  let p=null;(scene.pills||[]).forEach(pp=>{if(t>=pp[0]&&t<=pp[1])p=pp;});
  if(p){pillEl.className='pill on '+p[2];pillEl.textContent=p[3];}else pillEl.className='pill';
  scrub.value=t;
}
function frame(ts){const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
  if(playing&&scene){t+=dt*speed;if(t>scene.dur+.8)t=0;render();}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

const textEl=document.getElementById('text'),dotsEl=document.getElementById('dots'),countEl=document.getElementById('count'),stagecol=document.getElementById('stagecol'),slideEl=document.getElementById('slide');
SL.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Slide '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function go(i){
  cur=Math.max(0,Math.min(SL.length-1,i));const s=SL[cur];
  textEl.innerHTML=s.h;
  if(s.s){stagecol.hidden=false;slideEl.style.gridTemplateColumns='';load(s.s);}else{stagecol.hidden=true;scene=null;slideEl.style.gridTemplateColumns='minmax(0,1fr)';}
  [...dotsEl.children].forEach((b,j)=>b.setAttribute('aria-current',j===cur));
  countEl.textContent=(cur+1)+' / '+SL.length;
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SL.length-1;
  try{localStorage.setItem('dearborn-slide',cur);}catch(e){}
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
}
function setPlay(v){playing=v;playB.textContent=v?'Pause':'Play';playB.setAttribute('aria-pressed',String(!v));}
playB.onclick=()=>setPlay(!playing);
document.getElementById('replay').onclick=()=>{t=0;setPlay(true);render();};
slowB.onclick=()=>{speed=speed===1?.45:1;slowB.setAttribute('aria-pressed',String(speed!==1));};
scrub.oninput=()=>{t=parseFloat(scrub.value);setPlay(false);render();};
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '){e.preventDefault();setPlay(!playing);}});
let sx=null;slideEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
slideEl.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70&&!e.target.closest('.ctrl'))go(cur+(dx<0?1:-1));sx=null;});
let start=0;try{start=parseInt(localStorage.getItem('dearborn-slide')||'0',10)||0;}catch(e){}
setPlay(playing);go(start);
})();
</script>
</body>
